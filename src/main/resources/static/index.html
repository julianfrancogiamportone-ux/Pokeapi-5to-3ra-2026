<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8">
    <title>Pokebatallas pokeepicas</title> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css"> 
</head> 
<body> 
    <h1>¡Batalla de Universos! 
</h1> 
 
    <div id="fight-container"> 
        <div class="player"> 
            <h2>Jugador 1</h2> 
            <img id="Peleador1Image" src="placeholder1.png" alt="Personaje 1" class="Peleador-img"> 
            <select id="Peleador1"></select> 
        </div> 
 
        <div class="player"> 
            <h2>Jugador 2</h2> 
            <img id="Peleador2Image" src="placeholder2.png" alt="Personaje 2" class="Peleador-img"> 
            <select id="Peleador2"></select> 
        </div> 
    </div> 
 
    <button id="fightButton">¡Pelear!</button> 
 
    <div id="result" class="hidden"></div> 
 
    <script src="/js/script.js"></script> 
</body> 
</html>
